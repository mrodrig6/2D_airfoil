site_name: "2D finite-volume airfoil"
site_description: "Transonic airfoil studies with a Python Euler solver"
site_url: https://mrodrig6.github.io/2D_airfoil/
repo_url: https://github.com/mrodrig6/2D_airfoil
repo_name: mrodrig6/2D_airfoil
edit_uri: edit/main/docs/
strict: true
hooks:
  - docs/hooks.py
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
    absolute_links: warn
exclude_docs: |
  /README.md
  /hooks.py
  /check_links.py
nav:
  - Home: index.md
  - "Getting started":
      - "Installation": getting-started/installation.md
      - "Quick start": getting-started/quick-start.md
      - "Examples": getting-started/examples.md
  - "Running":
      - "Command line": running/command-line.md
      - "Configuration": running/configuration.md
      - "Solving a case": running/solving.md
      - "Reading results": running/output.md
      - "Parameter sweeps": running/sweeps.md
      - "Sensitivity analysis": running/sensitivity.md
      - "Shape optimization": running/optimization.md
      - "Troubleshooting": running/troubleshooting.md
      - "Airfoil geometry": running/geometry.md
      - "Generating meshes": running/meshing.md
      - "Importing meshes": running/mesh-import.md
      - "Plotting": running/plotting.md
      - "Adaptive refinement": running/adaptation.md
      - "Aerodynamics lab": running/lab-guide.md
  - "Python API":
      - "Library usage": api/package.md
      - "Extending the solver": api/extending.md
  - "Background / Model":
      - "Problem and assumptions": model/problem.md
      - "Parameters": model/parameters.md
      - "Units and reference scales": model/units.md
  - "Method":
      - "Spatial discretization": method/discretization.md
      - "Numerical fluxes": method/fluxes.md
      - "Boundary conditions": method/boundary-conditions.md
      - "Backends and performance": method/backends.md
      - "Time stepping and convergence": method/time-stepping.md
      - "Mesh generation": method/meshing.md
      - "Adaptive algorithm": method/adaptation.md
  - "Theory":
      - "Euler equations": theory/euler.md
      - "Discrete adjoint": theory/adjoint.md
      - "Airfoil geometry": theory/airfoil-geometry.md
  - "Validation":
      - "Test-suite claims": validation/tests.md
      - "Gradient comparisons": validation/gradients.md
      - "Legacy geometry": validation/legacy-geometry.md
      - "Thin-airfoil lift": validation/thin-airfoil.md
      - "Transonic NACA 0012": validation/transonic.md
      - "Numerical drag and pressure error": validation/numerical-drag.md
      - "Far-field sensitivity": validation/far-field.md
      - "Flux study": validation/flux-study.md
      - "Adaptation versus uniform refinement": validation/adaptation.md
      - "Legacy force integral": validation/legacy-forces.md
  - "Reference":
      - "Compatibility": reference/compatibility.md
      - "Code map": reference/code-map.md
      - "Repository map": reference/repository.md
      - "Continuous integration": reference/ci.md
      - "Figures": reference/figures.md
      - "Bibliography": reference/bibliography.md
      - "Development history": reference/history.md
      - "MATLAB provenance": reference/legacy.md
