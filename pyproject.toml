[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fvairfoil"
version = "0.1.0"
description = "2D finite-volume Euler solver for transonic airfoil studies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cfd", "finite-volume", "euler", "airfoil", "transonic", "aerospace", "adjoint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
jax = ["jax>=0.4.20"]
plot = ["matplotlib>=3.7"]
# everything a student needs for the lab
all = ["numba>=0.58", "jax>=0.4.20", "matplotlib>=3.7", "scipy>=1.10"]
# scipy is NOT a core dependency: the solver needs nothing from it.  It is used
# only to read the legacy `nacageom.mat` in one test and to drive the optimiser
# in the shape-optimisation example.
dev = ["pytest>=7.4", "ruff==0.16.10", "codespell>=2.2", "scipy>=1.10"]

docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10", "pymdown-extensions>=10,<11"]

[project.scripts]
fvairfoil = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that run a full solve (use --fast to skip them, --slow for only them)",
    "jax: tests that need JAX",
    "numba: tests that need Numba",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]

[tool.codespell]
# Every entry here is a false positive that codespell flags in aerodynamics or
# LaTeX, checked one by one -- not a way of silencing real typos:
#   nd     a normal component, n_d
#   oint   from the LaTeX \oint contour integral
#   pres   a local name for pressure
#   numer  from the journal abbreviation "SIAM J. Numer. Anal."
#   iy     an index
#   nin    appears inside the LaTeX \nin spacing of some equations
ignore-words-list = "nd,oint,pres,numer,iy,nin"
skip = "*.png,*.pdf,*.mat,./.git,./docs/figures,./legacy"
quiet-level = 2
